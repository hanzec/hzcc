name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish the verified HTML to GitHub Pages from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  VCPKG_MAX_CONCURRENCY: '2'
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 100MB

jobs:
  build:
    name: Doxygen coverage and HTML/PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: gcc:16.2.0@sha256:b8a42d6804296fbe7a54e17e9d60c3100d9e8dbe7ef88c748cae2ddb00d63ba2
    steps:
      - name: Prepare the container for checkout and caching
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git zstd
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore compiler cache
        id: ccache_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: linux-x64-ccache-v1-gcc-docs-${{ hashFiles('.github/scripts/setup-build.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-x64-ccache-v1-gcc-docs-${{ hashFiles('.github/scripts/setup-build.sh') }}-
            linux-x64-ccache-v1-gcc-docs-
      - name: Cache the pinned Doxygen build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hzcc-doxygen-1.18.0
          key: linux-x64-doxygen-1.18.0-gcc-16.2.0-${{ hashFiles('.github/scripts/setup-build.sh', 'cmake/patches/doxygen-1.18.0-find-guards.patch') }}
      - name: Set up build and documentation tools
        uses: ./.github/actions/setup-build
        with:
          compiler: gcc
          documentation: 'true'
      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vcpkg
          key: linux-x64-vcpkg-gcc-tests-off-${{ hashFiles('vcpkg.json', 'cmake/Dependencies.cmake', 'cmake/triplets/**', '.github/scripts/setup-build.sh', '.github/workflows/**') }}
          restore-keys: linux-x64-vcpkg-gcc-tests-off-
      - name: Test the documentation checkers
        run: |
          "$HZCC_PYTHON" -m unittest discover -s scripts/tests -v
      - name: Configure documentation
        run: |
          mkdir -p build/default
          cmake --preset default -DUNIT_TESTING=OFF -DE2E_TESTING=OFF \
            -DGENERATE_DOCUMENTATION=ON -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" -DPython3_EXECUTABLE="$HZCC_PYTHON" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee build/docs-configure.log
      - name: Check Doxygen XML coverage
        run: cmake --build --preset default --target check_doxygen 2>&1 | tee build/docs-doxygen-check.log
      - name: Check source declarations against the generated documentation
        run: |
          "$HZCC_PYTHON" scripts/check_source_doxygen.py hzcc scripts \
            --xml-dir build/default/doxygen_xml \
            --review-manifest scripts/source_doxygen_reviews.json \
            --report build/source-docs.json \
            2>&1 | tee build/docs-source-check.log
      - name: Build HTML and PDF
        run: |
          cmake --build --preset default --target documentation \
            2>&1 | tee build/docs-build.log
          test -s build/default/doxygen_html/index.html
          test -s build/default/doc/developers.pdf
      - name: Show compiler cache statistics
        id: ccache_stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --cleanup
            ccache --show-stats --verbose
            if [ -d "$CCACHE_DIR" ]; then
              printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save compiler cache even when documentation checks fail
        if: always() && steps.ccache_restore.outcome == 'success' && steps.ccache_restore.outputs.cache-hit != 'true' && steps.ccache_stats.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}
      - name: Upload documentation and audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: |
            build/default/doxygen_html/
            build/default/doc/developers.pdf
            build/default/doc/*.log
            build/default/doxygen-warnings.log
            build/docs-*.log
            build/source-docs.json
          retention-days: 14
      - name: Prepare the manually requested Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/default/doxygen_html

  deploy:
    name: Publish documentation to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
